name: rivero
description: "Rivero — Local-first, privacy-focused personal financial management application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  flutter_animate: ^4.5.2
  sprung: ^3.0.1
  animated_flip_counter: ^0.3.4
  flutter_card_swiper: ^7.2.0
  flutter_secure_storage: ^11.2.0
  app_links: ^7.2.2
  google_fonts: ^9.0.0
  intl: ^0.20.3
  drift: ^2.35.4
  path: ^1.9.1
  sqlite3: ^3.9.1
  crypto: ^3.0.8
  uuid: ^4.6.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
  build_runner: ^2.5.4
  drift_dev: ^2.35.3

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
