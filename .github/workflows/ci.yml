name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: these jobs only build and test.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      # Generated Drift code is not committed.
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: find lib -name '*.g.dart' -print0 | xargs -0 dart format
      - name: Format, analyze and test (same as tool/verify.sh)
        run: ./tool/verify.sh
