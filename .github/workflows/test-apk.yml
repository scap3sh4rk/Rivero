name: Test APK

# A release-signed APK of any branch, for testing on a phone that already
# has the released app (same signature, so it updates in place and keeps
# the data). Uploaded as a run artifact; publishes nothing.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: find lib -name '*.g.dart' -print0 | xargs -0 dart format

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Same version code as the latest release: installs over it, and the
      # next release (a higher code) installs over this.
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          code=$(gh release view --json tagName --jq .tagName | sed 's/.*-//')
          flutter build apk --release --build-number="${code:-1}"

      - uses: actions/upload-artifact@v4
        with:
          name: rivero-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
