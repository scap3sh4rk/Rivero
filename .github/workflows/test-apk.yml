name: Test APK

# A release-signed APK of any branch, for testing on a phone that already
# has the released app (same signature, so it updates in place and keeps
# the data). Uploaded as a run artifact; publishes nothing.
#
# Run it by pushing the commit to test to the test-apk branch:
#   git push origin develop:test-apk --force
on:
  workflow_dispatch:
  push:
    branches: [test-apk]

# Read-only token: these jobs only build and test.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: find lib -name '*.g.dart' -print0 | xargs -0 dart format

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Same version code as the latest release: installs over it, and the
      # next release (a higher code) installs over this.
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          code=$(gh release view --json tagName --jq .tagName | sed 's/.*-//')
          flutter build apk --release --build-number="${code:-1}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rivero-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
