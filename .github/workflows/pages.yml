name: Docs

# The documentation site (docs/) is published to GitHub Pages when it
# changes on main.
#
# One-time setup by a repository admin: Settings -> Pages -> Source:
# "GitHub Actions" (a private repository also needs a plan that includes
# Pages). Until then this workflow ends with a notice instead of failing,
# because the default token cannot switch Pages on.
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Is Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null | grep -qx workflow; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is not enabled::Open Settings > Pages and set Source to 'GitHub Actions', then re-run this workflow. Private repositories also need a plan that includes Pages."
          fi

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: docs

      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
