name: Release

# main is the release branch: every push to it builds signed Android
# artifacts and publishes a GitHub Release. Can also be run by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job that publishes the release asks for it.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the GitHub Release
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: find lib -name '*.g.dart' -print0 | xargs -0 dart format
      - run: ./tool/verify.sh

      # Tag: v<major.minor.patch from pubspec>-<build number>, e.g. v1.0.0-12.
      # Bump the pubspec version (1.x.x) for each release worth naming; the
      # build number always grows, so Android installs it as an update.
      - name: Version from pubspec
        id: version
        run: |
          name=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set; building with the debug key."
          fi

      - name: Build APK and App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          flutter build apk --release --build-number="$GITHUB_RUN_NUMBER"
          flutter build appbundle --release --build-number="$GITHUB_RUN_NUMBER"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/rivero-$TAG.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/rivero-$TAG.aab"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rivero-${{ steps.version.outputs.tag }}
          path: dist/

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Rivero ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: dist/*

  # An unsigned iOS build, attached to the same release. Experimental: it is
  # built and smoke-tested in the simulator but not tested on a device, and
  # must be signed (free Apple ID via AltStore/Sideloadly, or a paid
  # developer account) before it can be installed. A failure here never
  # blocks the Android release.
  ios:
    needs: android
    runs-on: macos-15
    permissions:
      contents: write # uploads the .ipa to the release
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: find lib -name '*.g.dart' -print0 | xargs -0 dart format
      - name: Build (no code signing)
        run: flutter build ios --release --no-codesign --build-number="$GITHUB_RUN_NUMBER"
      - name: Package and attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.android.outputs.tag }}
        run: |
          mkdir -p Payload dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "dist/rivero-$TAG-ios-unsigned.ipa" Payload
          gh release upload "$TAG" "dist/rivero-$TAG-ios-unsigned.ipa" --clobber
