name: iOS build

# Builds the iOS app on a GitHub macOS runner (no Mac needed) and uploads an
# UNSIGNED .ipa. It runs by hand (Actions -> "iOS build" -> Run workflow) and
# when the iOS project changes. macOS minutes are billed at a higher rate on
# private repositories, so it is not run on every push.
#
# An unsigned .ipa cannot be installed as is: sign it with a free Apple ID
# (AltStore, Sideloadly; valid 7 days) or, with a paid Apple Developer
# account, add signing secrets and a TestFlight upload step.
on:
  workflow_dispatch:
  push:
    # main is built by the release workflow (and attached to the release).
    branches: [develop]
    paths: ['ios/**', '.github/workflows/ios.yml']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: find lib -name '*.g.dart' -print0 | xargs -0 dart format

      - name: Build (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned .ipa
        run: |
          rm -rf dist Payload && mkdir -p Payload dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry dist/rivero-ios-unsigned.ipa Payload
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: rivero-ios-unsigned
          path: dist/rivero-ios-unsigned.ipa

      # No device needed for a smoke test: run the app in the iOS simulator,
      # check it is still alive after launch, and keep a screenshot.
      - name: Run in the iOS simulator
        run: |
          flutter build ios --simulator --debug
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$DEVICE" dev.scap3sh4rk.rivero
          sleep 25
          mkdir -p shots
          xcrun simctl io "$DEVICE" screenshot shots/launch.png
          xcrun simctl spawn "$DEVICE" launchctl list | grep dev.scap3sh4rk.rivero | tee alive.txt
          # First column is the process id; "-" means it has exited (crashed).
          if awk '{print $1}' alive.txt | grep -qx -- '-'; then
            echo "::error::The app is not running after launch (crashed?)"
            xcrun simctl spawn "$DEVICE" log show --last 2m --predicate 'process == "Runner"' | tail -80 || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rivero-ios-simulator-screenshot
          path: shots/
          if-no-files-found: ignore
