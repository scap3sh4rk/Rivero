name: Question or help
description: Ask how something works
title: "[Question] "
labels: [question]
body:
  - type: markdown
    attributes:
      value: Please look at the [user guide](https://github.com/scap3sh4rk/Rivero/tree/main/docs) FAQ first. Do not post real account details.
  - type: textarea
    id: q
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Rivero version
